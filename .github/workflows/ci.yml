name: CI

# Chạy mỗi khi đẩy code lên main hoặc mở Pull Request: kiểm tra code, chạy test, build, thử khởi động bằng Docker.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Có commit mới trên cùng nhánh thì hủy lần chạy cũ cho đỡ tốn thời gian.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: Backend (test với PostgreSQL thật)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tên database kết thúc bằng _test để bài test chịu chạy (xem server/test/helpers.js).
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: travel_test
      SESSION_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cài thư viện
        working-directory: server
        run: npm ci
      - name: Tạo bảng từ các file migration (001 → 009)
        run: |
          for file in server/sql/0*.sql; do
            echo "-> $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Chạy test
        working-directory: server
        run: npm test
      - name: Kiểm tra lỗ hổng trong thư viện đang dùng
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (build và khởi động thử)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image và khởi động cùng PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Kiểm tra backend và giao diện trả lời
        run: |
          curl --fail --silent --show-error http://localhost:5000/api/health
          curl --fail --silent --show-error http://localhost:5000/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://localhost:5000/api/tours | grep -q '"total"'
          curl --fail --silent --show-error http://localhost:5000/api/blog | grep -q '"items"'
      - name: In log nếu lỗi
        if: failure()
        run: docker compose logs --no-color
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
